<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPS Labels (offline)</title>
<style>
  :root { --teal: #147c7d; --ink: #0c1b2a; --line: #d8e2e7; --bg: #f4f7f9; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--ink); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 17px; }
  header small { opacity: .7; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #4a5a68; margin: 0 0 10px; }
  input, select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  #q { width: 100%; font-size: 16px; padding: 10px 12px; }
  .row { width: 100%; display: grid; grid-template-columns: 1fr auto 70px; gap: 10px; text-align: left; padding: 8px; border: 0; border-bottom: 1px solid var(--line); background: #fff; cursor: pointer; font: inherit; }
  .row:hover { background: #effaf9; }
  .qrow { display: grid; grid-template-columns: 1fr auto 70px 32px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .qrow input { width: 70px; }
  .qrow button { border: 0; background: none; cursor: pointer; color: #b42318; }
  .mono { font-family: Consolas, monospace; color: #4a5a68; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: #4a5a68; }
  .chk { flex-direction: row !important; align-items: center; gap: 6px !important; }
  #print { width: 100%; margin-top: 12px; padding: 12px; font: bold 16px Arial; color: #fff; background: var(--teal); border: 0; border-radius: 10px; cursor: pointer; }
  #preview { margin-top: 10px; padding: 10px; background: #f1f5f9; border-radius: 8px; overflow: auto; min-height: 40px; }
  #msg { margin-top: 8px; font-weight: bold; color: var(--teal); }
  .muted { color: #6b7b88; font-size: 12px; }
  .manual { display: grid; grid-template-columns: 1fr 1.4fr 80px auto; gap: 6px; margin-top: 10px; }
  .manual button { border: 1px solid var(--teal); color: var(--teal); background: #fff; border-radius: 8px; cursor: pointer; padding: 0 12px; }
</style>
</head>
<body>
<header><b>FPS Pharmacy · Labels</b><small>Works without internet</small></header>
<main>
  <div>
    <section>
      <h2>Find item</h2>
      <input id="q" placeholder="Search by name or barcode…" autocomplete="off" autofocus>
      <div id="results"></div>
      <p id="catinfo" class="muted"></p>
      <div class="manual">
        <input id="mbc" placeholder="Barcode">
        <input id="mname" placeholder="Name (optional)">
        <input id="mprice" placeholder="Price" type="number" step="0.01">
        <button id="add" type="button">Add</button>
      </div>
    </section>
    <section style="margin-top:16px">
      <h2>To print</h2>
      <div id="queue"></div>
    </section>
  </div>
  <section>
    <h2>Printer & label</h2>
    <div class="grid">
      <label style="grid-column:1/-1">Printer <select id="printer"></select></label>
      <label>Label size
        <select id="size"><option value="38x10">38 × 10 mm</option><option value="38x12">38 × 12 mm</option><option value="25x5">25 × 5 mm</option><option value="40x20">40 × 20 mm</option><option value="50x25">50 × 25 mm</option></select>
      </label>
      <label>Gap (mm) <input id="gap" type="number" step="0.5" value="2"></label>
      <label>Print as <select id="code"><option value="barcode">Barcode</option><option value="qr">QR code</option></select></label>
      <label>Barcode size <select id="bar"><option value="medium">Medium</option><option value="small">Small</option><option value="large">Large</option></select></label>
      <label class="chk"><input id="price" type="checkbox" checked> Price</label>
      <label class="chk"><input id="exp" type="checkbox" checked> Expiry</label>
      <label>Move right (mm) <input id="sx" type="number" step="0.5" value="0"></label>
      <label>Move down (mm) <input id="sy" type="number" step="0.5" value="0"></label>
      <label class="chk" style="grid-column:1/-1"><input id="rot" type="checkbox"> Turn 180° (if labels come out upside down)</label>
    </div>
    <div id="preview"></div>
    <button id="print" type="button">Print labels</button>
    <div id="msg"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
