# Managed by deploy/harden.sh — DO NOT edit by hand.
# Included from inside the HTTPS server { } block via `include` directive.

# Security headers (sent on all responses)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Upload cap (bulk inventory / customer imports)
client_max_body_size 50M;

# Rate-limit auth endpoints — defense in depth on top of the app-level throttle.
# Burst 10 = brief catch-up allowance; nodelay = reject excess immediately.
location = /api/auth/login {
    limit_req zone=pharmapos_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/platform/auth/login {
    limit_req zone=pharmapos_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
